plugins:
  - rubocop-thread_safety
  - rubocop-rails

AllCops:
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
  # The oldest Ruby in production (see the ruby line in the Gemfile)
  TargetRubyVersion: 3.4
  NewCops: enable

Layout/LineLength:
  Max: 120
Layout/MultilineOperationIndentation:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Rails:
  Enabled: true
Style/FrozenStringLiteralComment:
  # ActionView compiles templates into methods, so the magic comment has no effect there
  Exclude:
    - 'app/views/**/*.builder'
