plugins:
  - rubocop-thread_safety
  - rubocop-rails

AllCops:
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
  # Rails 8.1 requires Ruby 3.2 or newer
  TargetRubyVersion: 3.2
  NewCops: enable

Layout/LineLength:
  Max: 120
Layout/MultilineOperationIndentation:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Rails:
  Enabled: true
