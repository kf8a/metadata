# Recurring jobs, run by Solid Queue's scheduler (bin/jobs). Times are the server's time zone.
production:
  # Removes the record of finished jobs so the solid_queue_* tables don't grow forever
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Deletes sessions idle past the sign-in timeout (see SessionsTrimJob)
  sessions_trim:
    class: SessionsTrimJob
    schedule: every day at 3am

  # Deletes download permissions 30 days after they expire (see PermissionCleanupJob)
  permission_cleanup:
    class: PermissionCleanupJob
    schedule: every day at 3:15am
